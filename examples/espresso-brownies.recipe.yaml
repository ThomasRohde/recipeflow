recipeflow: 1
recipe:
  id: espresso-brownies
  title: Espresso Brownies
  source:
    url: https://www.cookingforengineers.com/
  yield: 16 brownies

ingredients:
  butter: {label: unsalted butter, quantity: 115 g}
  sugar: {label: sugar, quantity: 200 g}
  vanilla: {label: vanilla extract, quantity: 2.5 ml}
  espresso: {label: strong espresso, quantity: 60 ml}
  eggs: {label: large eggs, quantity: "2"}
  flour: {label: all-purpose flour, quantity: 80 g}
  cocoa: {label: cocoa powder, quantity: 80 g}
  baking-soda: {label: baking soda, quantity: 1.3 g}
  salt: {label: table salt, quantity: 1.5 g}

setup:
  - id: prepare-pan
    action: butter and flour
    target: 8x8-inch pan
    produces: prepared-pan
  - id: preheat-oven
    action: preheat
    target: oven
    temperature: 170 C
    produces: heated-oven

operations:
  - id: melt-butter
    action: melt
    inputs: [butter]
    outputs:
      melted-butter: {label: melted butter}
  - id: make-wet-base
    action: mix
    inputs: [melted-butter, sugar, vanilla, espresso]
    outputs:
      wet-base: {label: espresso mixture}
  - id: add-eggs
    action: mix
    inputs: [wet-base, eggs]
    outputs:
      wet-batter: {label: wet batter}
  - id: fold-dry
    action: fold
    inputs: [wet-batter, flour, cocoa, baking-soda, salt]
    outputs:
      brownie-batter: {label: brownie batter}
  - id: bake
    action: bake
    inputs: [brownie-batter]
    requires: [prepared-pan, heated-oven]
    duration: 30..40 min
    temperature: 170 C
    outputs:
      brownies: {label: espresso brownies, final: true, role: final}
