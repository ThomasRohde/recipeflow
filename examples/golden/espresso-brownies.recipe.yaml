recipeflow: 1
recipe:
  id: golden-espresso-brownies
  title: Espresso Brownies
  description: A dense compact flow modeled after the original RecipeFlow notation.
  source:
    title: RecipeFlow visual regression corpus
  yield: 16 brownies
  locale: en

ingredients:
  butter:
    label: unsalted butter
    quantity: 115 g
    source_text: 115 g unsalted butter
  sugar:
    label: granulated sugar
    quantity: 200 g
    source_text: 200 g granulated sugar
  vanilla:
    label: vanilla extract
    quantity: 2.5 mL
    source_text: 2.5 mL vanilla extract
  espresso:
    label: freshly brewed strong espresso
    quantity: 60 mL
    source_text: 60 mL freshly brewed strong espresso
  eggs:
    label: large eggs
    quantity: "2"
    source_text: 2 large eggs
  flour:
    label: all-purpose flour
    quantity: 80 g
    source_text: 80 g all-purpose flour
  cocoa:
    label: Dutch-process cocoa powder
    quantity: 80 g
    source_text: 80 g Dutch-process cocoa powder
  baking-soda:
    label: baking soda
    quantity: 1.3 g
    source_text: 1.3 g baking soda
  salt:
    label: fine sea salt
    quantity: 1.5 g
    source_text: 1.5 g fine sea salt

setup:
  - id: prepare-pan
    action: butter and flour
    label: Butter and flour an 8 × 8 inch baking pan
    target: 8 × 8 inch baking pan
    produces: prepared-pan
  - id: preheat-oven
    action: preheat
    label: Preheat the oven
    target: oven
    temperature: 170 °C
    produces: heated-oven

operations:
  - id: melt-butter
    action: melt
    inputs: [butter]
    outputs:
      melted-butter: {label: melted butter}
  - id: make-wet-base
    action: mix
    inputs: [melted-butter, sugar, vanilla, espresso]
    outputs:
      wet-base: {label: glossy espresso mixture}
  - id: add-eggs
    action: whisk
    inputs: [wet-base, eggs]
    outputs:
      wet-batter: {label: aerated wet batter}
  - id: fold-dry
    action: fold
    inputs: [wet-batter, flour, cocoa, baking-soda, salt]
    outputs:
      brownie-batter: {label: espresso brownie batter}
  - id: bake
    action: bake
    inputs: [brownie-batter]
    requires: [prepared-pan, heated-oven]
    duration: 30..40 min
    temperature: 170 °C
    completion_criteria: a tester emerges with moist crumbs but no raw batter
    outputs:
      brownies:
        label: sixteen fudgy espresso brownies
        final: true
        role: final
