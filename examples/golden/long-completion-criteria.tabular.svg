<text id="text:operation:op:dissolve:detail" data-role="operation-detail" font-size="12" font-weight="400" fill="#66615c" xml:space="preserve" aria-label="Temperature: medium · Time: 4 to 6 min"><tspan x="281" dy="0" y="244.851">Temperature: medium · Time:</tspan><tspan x="331" dy="0" y="260.451">4 to 6 min</tspan></text>
<text id="text:operation:op:dissolve:until" data-role="operation-until" font-size="11" font-weight="400" fill="#66615c" xml:space="preserve" aria-label="Until every visible crystal has disappeared from both the syrup and the inner wall of the pan, and the liquid is completely transparent when viewed against a white spatula"><tspan x="286" dy="0" y="279.051">Until every visible crystal has</tspan><tspan x="278" dy="0" y="293.351">disappeared from both the syrup</tspan><tspan x="286" dy="0" y="307.651">and the inner wall of the pan,</tspan><tspan x="289.5" dy="0" y="321.951">and the liquid is completely</tspan><tspan x="295.5" dy="0" y="336.251">transparent when viewed</tspan><tspan x="300" dy="0" y="350.551">against a white spatula</tspan></text>
<text id="text:operation:op:caramelize:action" data-role="operation-action" font-size="13" font-weight="600" fill="#202124" xml:space="preserve" aria-label="caramelize while swirling occasionally"><tspan x="658.5" dy="0" y="145.726">caramelize while swirling</tspan><tspan x="694.5" dy="0" y="162.626">occasionally</tspan></text>
<text id="text:operation:op:caramelize:detail" data-role="operation-detail" font-size="12" font-weight="400" fill="#66615c" xml:space="preserve" aria-label="Temperature: medium · Time: 8 to 12 min"><tspan x="654" dy="0" y="181.526">Temperature: medium · Time:</tspan><tspan x="701" dy="0" y="197.126">8 to 12 min</tspan></text>
<text id="text:operation:op:caramelize:until" data-role="operation-until" font-size="11" font-weight="400" fill="#66615c" xml:space="preserve" aria-label="Until the syrup is an even deep amber from edge to center, gives off the first faint thread of smoke, and has not developed any dark bitter spots"><tspan x="654.5" dy="0" y="215.726">Until the syrup is an even deep</tspan><tspan x="650" dy="0" y="230.026">amber from edge to center, gives</tspan><tspan x="667" dy="0" y="244.326">off the first faint thread of</tspan><tspan x="657" dy="0" y="258.626">smoke, and has not developed</tspan><tspan x="680" dy="0" y="272.926">any dark bitter spots</tspan></text>
<text id="text:operation:op:finish:action" data-role="operation-action" font-size="13" font-weight="600" fill="#202124" xml:space="preserve" aria-label="carefully whisk in dairy and seasoning"><tspan x="1010" dy="0" y="282.851">carefully whisk in dairy and</tspan><tspan x="1058.5" dy="0" y="299.751">seasoning</tspan></text>
<text id="text:operation:op:finish:input-quantities" data-role="operation-input-quantity" font-size="12" font-weight="400" fill="#66615c" xml:space="preserve" aria-label="Uses: 60 g unsalted butter · 240 mL warm heavy cream · 4 g flaky sea salt"><tspan x="1017.5" dy="0" y="318.651">Uses: 60 g unsalted butter ·</tspan><tspan x="1011" dy="0" y="334.251">240 mL warm heavy cream · 4</tspan><tspan x="1050" dy="0" y="349.851">g flaky sea salt</tspan></text>
<text id="text:operation:op:finish:detail" data-role="operation-detail" font-size="12" font-weight="400" fill="#66615c" xml:space="preserve" aria-label="Temperature: low · Time: 3 to 5 min"><tspan x="1008" dy="0" y="369.451">Temperature: low · Time: 3 to 5</tspan><tspan x="1078" dy="0" y="385.051">min</tspan></text>
<text id="text:operation:op:finish:until" data-role="operation-until" font-size="11" font-weight="400" fill="#66615c" xml:space="preserve" aria-label="Until bubbling has subsided, every piece of butter is incorporated, and a spoonful cools to a thick ribbon that remains smooth rather than grainy"><tspan x="1019.5" dy="0" y="403.651">Until bubbling has subsided,</tspan><tspan x="1032.5" dy="0" y="417.951">every piece of butter is</tspan><tspan x="1019" dy="0" y="432.251">incorporated, and a spoonful</tspan><tspan x="1023" dy="0" y="446.551">cools to a thick ribbon that</tspan><tspan x="1020" dy="0" y="460.851">remains smooth rather than</tspan><tspan x="1072.5" dy="0" y="475.151">grainy</tspan></text>
